<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're invited to a show</title>

<!-- Open Graph: what iMessage / WhatsApp renders as the preview card. GitHub
     Pages cannot generate per-invite tags, so the card is generic and the show
     details only appear once the page loads. -->
<meta property="og:type" content="website" />
<meta property="og:title" content="You're invited to a show" />
<meta property="og:description" content="Setsy is a passport for the shows you've been to. Log concerts, collect city stamps, and see what your friends have seen." />
<meta property="og:image" content="https://join.setsyapp.com/invite/og-card.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:url" content="https://join.setsyapp.com/s/" />
<meta name="twitter:card" content="summary_large_image" />

<style>
  :root {
    color-scheme: light dark;
    --bg: #0a0a0a;
    --text: #f2f2f2;
    --muted: #a3a3a3;
    --line: rgba(255,255,255,0.12);
    --surface: rgba(255,255,255,0.06);
    --link: #8ab4ff;
    --brand: #F5C518;
    --brand-pressed: #D9A800;
    --on-brand: #1A1500;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff;
      --text: #171717;
      --muted: #55565a;
      --line: rgba(0,0,0,0.12);
      --surface: rgba(0,0,0,0.04);
      --link: #2452b8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  main {
    max-width: 420px;
    margin: 0 auto;
    padding: 56px 24px 96px;
  }
  .eyebrow {
    color: var(--muted);
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0 0 10px;
  }
  h1 {
    font-size: 1.75rem;
    line-height: 1.25;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .ticket {
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    margin: 0 0 24px;
    background: var(--surface);
  }
  .venue { margin: 0; color: var(--text); font-size: 1rem; }
  .date { margin: 4px 0 0; color: var(--muted); font-size: 0.95rem; }
  .status {
    margin: 14px 0 0;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.9rem;
  }
  .btn {
    display: block;
    width: 100%;
    text-align: center;
    text-decoration: none;
    font-weight: 600;
    font-size: 1rem;
    padding: 15px 20px;
    border-radius: 12px;
    margin-bottom: 10px;
    border: 1px solid transparent;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-primary { background: var(--brand); color: var(--on-brand); }
  .btn-primary:active { background: var(--brand-pressed); }
  .btn-secondary { background: var(--surface); color: var(--text); border-color: var(--line); }
  .btn[hidden] { display: none; }
  .btn[disabled] { opacity: 0.55; }
  .hint {
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
    margin: 12px 0 0;
    min-height: 1.4em;
  }
  .note {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 32px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
  }
  .note a { color: var(--link); }
</style>
</head>
<body>
<main>
  <p class="eyebrow" id="eyebrow">You're invited</p>
  <h1 id="artist">A show on Setsy</h1>

  <div class="ticket">
    <p class="venue" id="venue"></p>
    <p class="date" id="date"></p>
    <p class="status" id="status" hidden></p>
  </div>

  <button class="btn btn-primary" id="cta" type="button">Join the beta</button>
  <a class="btn btn-secondary" id="open-btn" href="#" hidden>Already have Setsy? Open it</a>
  <p class="hint" id="hint"></p>

  <p class="note">
    Setsy is a passport for the shows you've been to - log concerts, collect
    city stamps, and see what your friends have seen.
    <br /><br />
    <a href="../">Privacy policy</a>
  </p>
</main>

<script>
  // ---------------------------------------------------------------------
  // Config. At App Store launch: set DISTRIBUTION to 'app-store' and fill in
  // APP_STORE_URL. Keep this in step with lib/invites/config.ts in the app.
  // ---------------------------------------------------------------------
  var DISTRIBUTION = 'testflight';            // 'testflight' | 'app-store'
  var TESTFLIGHT_URL = 'https://testflight.apple.com/join/vNR23aRV';
  var APP_STORE_URL = null;                   // e.g. 'https://apps.apple.com/app/id1234567890'
  var APP_SCHEME_URL = 'noctaconcertpassport://show-invite?t=';
  var CLIPBOARD_TOKEN_PREFIX = 'setsy-invite:';

  function installUrl() {
    return DISTRIBUTION === 'app-store' ? APP_STORE_URL : TESTFLIGHT_URL;
  }

  function installLabel() {
    if (DISTRIBUTION === 'app-store') {
      return APP_STORE_URL ? 'Get Setsy' : 'Coming soon to the App Store';
    }
    return 'Join the beta';
  }

  // ---------------------------------------------------------------------
  // Everything below the query string is UNTRUSTED. It is only ever written
  // to the page via textContent, and the token is shape-checked against the
  // same pattern the database enforces (invites_token_shape).
  // ---------------------------------------------------------------------
  var params = new URLSearchParams(window.location.search);

  function text(key, max) {
    var value = (params.get(key) || '').trim();
    if (!value) return null;
    return value.length > max ? value.slice(0, max) : value;
  }

  function readToken() {
    var raw = (params.get('t') || '').trim();
    return /^[A-Za-z0-9_-]{16,64}$/.test(raw) ? raw : null;
  }

  function readDate() {
    var raw = (params.get('d') || '').trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(raw)) return null;
    var parts = raw.split('-').map(Number);
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    // Reject a well-formed string that is not a real calendar date (2026-02-31).
    if (d.getFullYear() !== parts[0] || d.getMonth() !== parts[1] - 1 || d.getDate() !== parts[2]) {
      return null;
    }
    return d;
  }

  var token = readToken();
  // A private event's link never carries its name or place (the app leaves
  // them out on purpose; see buildShowInviteUrl). Ignore them even if present.
  var isPrivate = params.get('p') === '1';
  var artist = isPrivate ? 'A private event' : text('a', 120);
  var venue = isPrivate ? null : text('v', 120);
  var city = isPrivate ? null : text('c', 120);
  var inviter = text('i', 60);
  var showDate = readDate();

  var $ = function (id) { return document.getElementById(id); };

  if (artist) $('artist').textContent = artist;
  if (inviter) $('eyebrow').textContent = inviter + ' invited you';
  $('venue').textContent = venue ? (city ? venue + ' · ' + city : venue) : '';
  $('date').textContent = showDate
    ? showDate.toLocaleDateString(undefined, {
        weekday: 'short', month: 'short', day: 'numeric', year: 'numeric',
      })
    : '';

  // Hard rule 1, on the web too: a show that already happened never offers a
  // way in. Compared at local midnight so "today" still counts as live.
  var today = new Date();
  today.setHours(0, 0, 0, 0);
  var isPast = showDate != null && showDate < today;

  var cta = $('cta');
  var hint = $('hint');

  if (isPast) {
    $('status').textContent = 'This show already happened.';
    $('status').hidden = false;
    cta.textContent = 'This show has passed';
    cta.disabled = true;
    cta.className = 'btn btn-secondary';
  } else {
    cta.textContent = installLabel();
    if (!installUrl()) cta.disabled = true;

    // Deep link, for anyone who already has the app. No auto-redirect: on iOS
    // a failed scheme navigation shows "Cannot Open Page" to everyone else.
    if (token) {
      var openBtn = $('open-btn');
      openBtn.href = APP_SCHEME_URL + encodeURIComponent(token);
      openBtn.hidden = false;
    }
  }

  /**
   * Clipboard handoff. A TestFlight install carries no attribution, so nothing
   * about this page survives it - copying the token on the way out is what
   * lets the app pick the invite up on first launch. Best-effort: if the copy
   * fails or is blocked, the CTA still sends them to install, and they simply
   * arrive as a normal guest.
   */
  function copyToken() {
    if (!token) return Promise.resolve(false);
    var payload = CLIPBOARD_TOKEN_PREFIX + token;

    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(payload).then(function () { return true; },
                                                         function () { return false; });
    }

    try {
      var el = document.createElement('textarea');
      el.value = payload;
      el.setAttribute('readonly', '');
      el.style.position = 'absolute';
      el.style.left = '-9999px';
      document.body.appendChild(el);
      el.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(el);
      return Promise.resolve(ok);
    } catch (err) {
      return Promise.resolve(false);
    }
  }

  cta.addEventListener('click', function () {
    var url = installUrl();
    if (!url || isPast) return;

    // Must not block the navigation - a slow or hung clipboard write should
    // never cost the user the install.
    copyToken().then(function (copied) {
      if (copied) hint.textContent = 'Invite saved - open Setsy after installing.';
    });

    window.location.href = url;
  });
</script>
</body>
</html>
